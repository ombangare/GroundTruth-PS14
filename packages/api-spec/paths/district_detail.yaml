get:
  summary: Get District Details
  description: Fetches the full indicator breakdown for a single district. By default, returns the most recent cached comparison. If year_before and year_after are provided, it searches the database cache for those specific years. Triggers live Earth Engine compute on cache miss (depending on user role).
  parameters:
    - name: district_id
      in: path
      required: true
      schema:
        type: string
      description: The unique identifier of the district.
    - name: year_before
      in: query
      required: false
      schema:
        type: integer
      description: Optional baseline year to compare against (e.g., 2019). Searches cached data first.
    - name: year_after
      in: query
      required: false
      schema:
        type: integer
      description: Optional target year to compare (e.g., 2023). Searches cached data first.
  responses:
    '200':
      description: Detailed district information with indicators
      content:
        application/json:
          schema:
            $ref: '../schemas/DistrictDetail.yaml'
    '404':
      description: District not found
      content:
        application/json:
          schema:
            type: object
            properties:
              detail:
                type: string
