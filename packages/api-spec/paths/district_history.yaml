get:
  summary: Get District Cache History
  description: Returns a list of all years for which we have cached satellite data for this district. Useful for the frontend to present a timeline dropdown without forcing a re-query.
  parameters:
    - name: district_id
      in: path
      required: true
      schema:
        type: string
      description: The unique identifier of the district.
  responses:
    '200':
      description: A list of cached years and available indicators
      content:
        application/json:
          schema:
            $ref: '../schemas/DistrictHistory.yaml'
    '404':
      description: District not found
