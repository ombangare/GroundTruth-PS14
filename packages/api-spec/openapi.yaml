openapi: 3.0.3
info:
  title: GroundTruth API
  description: Satellite-derived SDG indicators, translated into plain language.
  version: 0.1.0
paths:
  /:
    $ref: './paths/root.yaml'
  /health:
    $ref: './paths/health.yaml'
  /api/districts/:
    $ref: './paths/districts.yaml'
  /api/districts/{district_id}:
    $ref: './paths/district_detail.yaml'
  /api/districts/{district_id}/history:
    $ref: './paths/district_history.yaml'
components:
  schemas:
    DistrictSummary:
      $ref: './schemas/DistrictSummary.yaml'
    DistrictDetail:
      $ref: './schemas/DistrictDetail.yaml'
    Indicator:
      $ref: './schemas/Indicator.yaml'
    DistrictHistory:
      $ref: './schemas/DistrictHistory.yaml'
